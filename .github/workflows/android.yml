name: Build TWD Translator APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -o app.zip -d project
          cd project
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'TWDTranslator'
          include ':app'
          EOF

                    cat > build.gradle <<'EOF'
          
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF
                    cat >> app/build.gradle <<'EOF'

          configurations.all {
              resolutionStrategy.eachDependency { details ->
                  if (details.requested.group == 'org.jetbrains.kotlin' &&
                      details.requested.name in ['kotlin-stdlib', 'kotlin-stdlib-jdk7', 'kotlin-stdlib-jdk8']) {
                      details.useVersion '1.8.22'
                  }
              }
          }
          EOF
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF
          echo "android.useAndroidX=true" > gradle.properties
          gradle -p . assembleDebug
        
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TWD-Translator
          path: project/app/build/outputs/apk/debug/*.apk
